<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- SPDX-License-Identifier: EUPL-1.2 OR GPL-3.0-or-later -->
<!-- The generic families, for the scratch fonts of make-gallery and make-demo, which
     have no system configuration: without them WebKit finds no font behind sans-serif,
     and an SVG text in it measures empty, so Mermaid draws no sequence diagram. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family><family>Iosevka Nerd Font</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family><family>Iosevka Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
