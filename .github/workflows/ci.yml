# SPDX-License-Identifier: EUPL-1.2 OR GPL-3.0-or-later
#
# The comprehensive test suite, on every branch.  It holds no rule: the checks are in the
# Makefile, and docs/reference/release-pipeline.md describes this file.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Before 1.0.0 only a branch's tip must pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A branch of the repository is checked at its push. A pull request is checked only
    # when it comes from a fork, so that no branch is checked twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    name: ${{ matrix.part }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    # A beginning on macOS, which what follows on Linux does not wait for: see the reference.
    continue-on-error: ${{ matrix.part == 'macos' }}
    # One job per part, side by side. Every directory of tests is in one part, as a test of
    # tests/tools/release_test.py requires, and all must pass before CD goes on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: static}
          - {part: macos, os: macos-15, tests: tests/sommaire}
          - {part: smoke}
          - {part: imprimeur-1, tests: tests/imprimeur, page: 1/5}
          - {part: imprimeur-2, tests: tests/imprimeur, page: 2/5}
          - {part: imprimeur-3, tests: tests/imprimeur, page: 3/5}
          - {part: imprimeur-4, tests: tests/imprimeur, page: 4/5}
          - {part: imprimeur-5, tests: tests/imprimeur, page: 5/5}
          - {part: briefing, tests: tests/imprimeur-skin-briefing, skin: briefing}
          - {part: dubai, tests: tests/imprimeur-skin-dubai, skin: dubai}
          - {part: ecrivain, tests: tests/imprimeur-skin-ecrivain, skin: ecrivain}
          - {part: minitel, tests: tests/imprimeur-skin-minitel, skin: minitel}
          - {part: tianlu, tests: tests/imprimeur-skin-tianlu, skin: tianlu}
          - {part: xix, tests: tests/imprimeur-skin-xix, skin: xix}
          - {part: xvii, tests: tests/imprimeur-skin-xvii, skin: xvii}
          - {part: xviii, tests: tests/imprimeur-skin-xviii, skin: xviii}
          - {part: others, tests: tests/sommaire tests/tools tests/docs}
    # Measured here: make check in 10 minutes, the smoke test in 1, nothing to fetch. Three
    # times that on a runner, and the shell's fetch and the build of what cache.nixos.org lacks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own commit: GitHub's merge of it has a title no check accepts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history: the check of the commits reads it back to main.
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      # That runner's AppArmor otherwise stops the sandboxes of Chromium and WebKit, which
      # the tests keep rather than pass --no-sandbox.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.part == 'static'
        run: nix develop -c make check-static
      - if: matrix.part == 'static' && github.ref != 'refs/heads/main'
        run: nix develop -c make commits BASE=origin/main
      - if: matrix.part == 'macos'
        run: nix develop -c make test-js test-python
      - if: matrix.tests
        run: nix develop -c make test-elisp ERT_DIRS="${{ matrix.tests }}"
        env:
          IMPRIMEUR_TEST_PAGE: ${{ matrix.page }}
          # A new order and new pages for each run, the same for each of its jobs. To replay
          # a failure: this run's id as the seed, and the job's page, to `make test-elisp'.
          IMPRIMEUR_TEST_SEED: ${{ github.run_id }}
      - if: matrix.part == 'smoke'
        run: nix develop -c xvfb-run -a -s "-screen 0 1280x1024x24" make smoke-xwidget
        env:
          GDK_BACKEND: x11
      # Whatever its tests said, so that a job tells both.
      - if: ${{ !cancelled() && matrix.skin }}
        run: nix develop -c xvfb-run -a -s "-screen 0 1280x1024x24" make smoke-xwidget
        env:
          GDK_BACKEND: x11
          IMPRIMEUR_SMOKE_SKIN: ${{ matrix.skin }}
