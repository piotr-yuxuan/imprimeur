<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="24" height="24">
  <!-- SPDX-License-Identifier: EUPL-1.2 OR GPL-3.0-or-later -->
  <!-- A rosette of eight petals in a ring, which the sheet uses as a mask, so that it takes the
       palette's gold: only its shape counts.  No figure, and not the sign U+06DD or U+06DE. -->
  <circle r="11" fill="none" stroke="#000" stroke-width="1.2"/>
  <circle r="2.6"/>
  <g>
    <ellipse cy="-6.4" rx="2.1" ry="3.4"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(45)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(90)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(135)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(180)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(225)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(270)"/>
    <ellipse cy="-6.4" rx="2.1" ry="3.4" transform="rotate(315)"/>
  </g>
</svg>
