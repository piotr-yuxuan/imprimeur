<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edit-to-page-title edit-to-page-desc" id="edit-to-page-root">
        <title id="edit-to-page-title">From a keystroke to the page</title>
        <desc id="edit-to-page-desc">An edit in the Emacs buffer reaches the session, which waits for a pause, renders the whole text with pandoc, then announces a revision that the Chromium page fetches, sanitises and shows, or an error that the page shows in its banner while it keeps the last revision.</desc>
        <defs>
      <style>#edit-to-page-root { --color-paper:   #f7f7f7;   
      --color-ink:     #4d4d4c;   
      --color-muted:   #5e605c;   
      --color-accent:  #8959a8;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #edit-to-page-root { font-family: var(--font-sans); color: var(--color-ink); }
      #edit-to-page-root .diagram-container { width: 100%; overflow-x: auto; }
      #edit-to-page-root .diagram-container { overflow-x: visible; }</style>
          <marker id="edit-to-page-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5e605c"/></marker>
          <marker id="edit-to-page-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8959a8"/></marker>
          <marker id="edit-to-page-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4271ae"/></marker>
          <!-- Open arrowhead: an event on the page's event stream, sent without a reply. -->
          <marker id="edit-to-page-arrow-open-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4271ae" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f7f7"/>

        <!-- ALT fragment: what the session does with the outcome of a render.
             Spans pandoc, the session and the page; drawn first, under everything. -->
        <rect x="296" y="284" width="676" height="412" rx="4" fill="#4d4d4c" stroke="#4d4d4c" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <line x1="304" y1="576" x2="964" y2="576" stroke="#4d4d4c" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.20"/>

        <!-- Lifelines: buffer 120, session 344, pandoc 568, page 792 -->
        <line x1="120" y1="104" x2="120" y2="700" stroke="#4d4d4c" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="344" y1="104" x2="344" y2="700" stroke="#4d4d4c" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="568" y1="104" x2="568" y2="700" stroke="#4d4d4c" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="792" y1="104" x2="792" y2="700" stroke="#4d4d4c" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Activation bars: pandoc while it runs; the page while it updates.
             Each sits on an opaque base so that its lifeline does not show through. -->
        <rect x="564" y="228" width="8" height="132" fill="#f7f7f7"/>
        <rect x="564" y="228" width="8" height="132" fill="#4d4d4c" stroke="#5e605c" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="788" y="396" width="8" height="160" fill="#f4f4f4"/>
        <rect x="788" y="396" width="8" height="160" fill="#4d4d4c" stroke="#5e605c" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="788" y="636" width="8" height="48" fill="#f4f4f4"/>
        <rect x="788" y="636" width="8" height="48" fill="#4d4d4c" stroke="#5e605c" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Messages, drawn before their labels and before the actors -->
        <!-- M1 buffer to session: after-change-functions -->
        <line x1="120" y1="140" x2="344" y2="140" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M2 session to itself: the scheduling decision -->
        <path d="M 344 160 L 364 160 Q 372 160 372 168 L 372 184 Q 372 192 364 192 L 346 192" fill="none" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M3 session to pandoc: the whole text on standard input -->
        <line x1="344" y1="228" x2="564" y2="228" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M4 buffer to session while pandoc runs: a render is only marked pending -->
        <line x1="120" y1="264" x2="344" y2="264" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M5 pandoc to session (return): the HTML fragment and the title and
             language, as one line of JSON after the filter's marker line -->
        <line x1="564" y1="360" x2="344" y2="360" stroke="#5e605c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M6 session to page: event revision with its number -->
        <line x1="344" y1="396" x2="788" y2="396" stroke="#4271ae" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#edit-to-page-arrow-open-link)"/>
        <!-- M7 page to session: GET .imprimeur/doc -->
        <line x1="788" y1="432" x2="344" y2="432" stroke="#4271ae" stroke-width="1.2" marker-end="url(#edit-to-page-arrow-link)"/>
        <!-- M8 session to page: the JSON document (headline) -->
        <line x1="344" y1="468" x2="788" y2="468" stroke="#8959a8" stroke-width="1.4" marker-end="url(#edit-to-page-arrow-accent)"/>
        <!-- M9 page to itself: DOMPurify, then replace the contents of main -->
        <path d="M 796 488 L 816 488 Q 824 488 824 496 L 824 512 Q 824 520 816 520 L 798 520" fill="none" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
        <!-- M10 page to session: POST {type: ready, rev} -->
        <line x1="788" y1="556" x2="344" y2="556" stroke="#4271ae" stroke-width="1.2" marker-end="url(#edit-to-page-arrow-link)"/>
        <!-- M11 session to page: event error with its message -->
        <line x1="344" y1="636" x2="788" y2="636" stroke="#4271ae" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#edit-to-page-arrow-open-link)"/>
        <!-- M12 page to itself: main unchanged, the message in the banner as text -->
        <path d="M 796 648 L 816 648 Q 824 648 824 656 L 824 672 Q 824 680 816 680 L 798 680" fill="none" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>

        <!-- Labels: opaque masks 8 px above their line, or 8 px right of a loop.
             Inside the fragment the mask takes the fragment's composited fill. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing="0.06em">
          <rect x="176" y="120" width="112" height="12" rx="2" fill="#f7f7f7"/>
          <text x="232" y="130" fill="#5e605c" text-anchor="middle">AFTER-CHANGE</text>

          <rect x="380" y="160" width="104" height="32" rx="2" fill="#f7f7f7"/>
          <text x="386" y="172" fill="#5e605c">QUIET 0.3 S</text>
          <text x="386" y="188" fill="#5e605c">AT MOST 2 S</text>

          <rect x="396" y="208" width="120" height="12" rx="2" fill="#f7f7f7"/>
          <text x="456" y="218" fill="#5e605c" text-anchor="middle">TEXT TO STDIN</text>

          <rect x="172" y="244" width="120" height="12" rx="2" fill="#f7f7f7"/>
          <text x="232" y="254" fill="#5e605c" text-anchor="middle">EDIT: PENDING</text>

          <rect x="404" y="340" width="104" height="12" rx="2" fill="#f4f4f4"/>
          <text x="456" y="350" fill="#5e605c" text-anchor="middle">HTML + META</text>

          <rect x="632" y="376" width="96" height="12" rx="2" fill="#f4f4f4"/>
          <text x="680" y="386" fill="#4271ae" text-anchor="middle">REVISION N</text>

          <rect x="644" y="412" width="72" height="12" rx="2" fill="#f4f4f4"/>
          <text x="680" y="422" fill="#4271ae" text-anchor="middle">GET DOC</text>

          <rect x="616" y="448" width="128" height="12" rx="2" fill="#f4f4f4"/>
          <text x="680" y="458" fill="#8959a8" text-anchor="middle">JSON WITH HTML</text>

          <rect x="832" y="488" width="112" height="32" rx="2" fill="#f4f4f4"/>
          <text x="838" y="500" fill="#5e605c">DOMPURIFY</text>
          <text x="838" y="516" fill="#5e605c">REPLACE MAIN</text>

          <rect x="624" y="536" width="112" height="12" rx="2" fill="#f4f4f4"/>
          <text x="680" y="546" fill="#4271ae" text-anchor="middle">POST READY N</text>

          <rect x="620" y="616" width="120" height="12" rx="2" fill="#f4f4f4"/>
          <text x="680" y="626" fill="#4271ae" text-anchor="middle">ERROR MESSAGE</text>

          <rect x="832" y="648" width="128" height="32" rx="2" fill="#f4f4f4"/>
          <text x="838" y="660" fill="#5e605c">KEEP LAST REV</text>
          <text x="838" y="676" fill="#5e605c">TEXT IN BANNER</text>
        </g>

        <!-- Fragment tab and guards -->
        <rect x="296" y="284" width="40" height="16" rx="2" fill="#f7f7f7" stroke="#4d4d4c" stroke-width="1" stroke-opacity="0.22"/>
        <text x="316" y="296" fill="#5e605c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="356" y="316" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[render ok]</text>
        <text x="356" y="600" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[render failed]</text>

        <!-- Actors, drawn after the messages -->
        <!-- Buffer (input) -->
        <rect x="40" y="40" width="160" height="64" rx="6" fill="#f7f7f7"/>
        <rect x="40" y="40" width="160" height="64" rx="6" fill="#5e605c" stroke="#6a6c68" stroke-width="1" fill-opacity="0.10"/>
        <text x="120" y="68" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Buffer</text>
        <text x="120" y="88" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Emacs</text>
        <!-- Session (backend) -->
        <rect x="264" y="40" width="160" height="64" rx="6" fill="#f7f7f7"/>
        <rect x="264" y="40" width="160" height="64" rx="6" fill="#ffffff" stroke="#4d4d4c" stroke-width="1"/>
        <text x="344" y="68" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session</text>
        <text x="344" y="88" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Emacs</text>
        <!-- pandoc (external) -->
        <rect x="488" y="40" width="160" height="64" rx="6" fill="#f7f7f7"/>
        <rect x="488" y="40" width="160" height="64" rx="6" fill="#4d4d4c" stroke="#4d4d4c" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="568" y="68" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">pandoc</text>
        <text x="568" y="88" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one per render</text>
        <!-- Page (backend) -->
        <rect x="712" y="40" width="160" height="64" rx="6" fill="#f7f7f7"/>
        <rect x="712" y="40" width="160" height="64" rx="6" fill="#ffffff" stroke="#4d4d4c" stroke-width="1"/>
        <text x="792" y="68" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Page</text>
        <text x="792" y="88" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Chromium</text>

        <!-- Legend: horizontal strip in the bottom 60 px. No "LEGEND" word: at
             the eyebrow size it would draw under 7 px on GitHub, and the strip
             of keyed swatches reads as a key without it. -->
        <line x1="40" y1="716" x2="984" y2="716" stroke="#4d4d4c" stroke-width="0.8" stroke-opacity="0.10"/>
        <g font-family="'Geist', system-ui, sans-serif" font-size="11" fill="#5e605c">
          <line x1="40" y1="744" x2="68" y2="744" stroke="#5e605c" stroke-width="1.2" marker-end="url(#edit-to-page-arrow)"/>
          <text x="76" y="748">Call</text>
          <line x1="152" y1="744" x2="180" y2="744" stroke="#5e605c" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#edit-to-page-arrow)"/>
          <text x="188" y="748">Return</text>
          <line x1="276" y1="744" x2="304" y2="744" stroke="#4271ae" stroke-width="1.2" marker-end="url(#edit-to-page-arrow-link)"/>
          <text x="312" y="748">HTTP request</text>
          <line x1="440" y1="744" x2="468" y2="744" stroke="#4271ae" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#edit-to-page-arrow-open-link)"/>
          <text x="476" y="748">Server-sent event</text>
          <line x1="636" y1="744" x2="664" y2="744" stroke="#8959a8" stroke-width="1.4" marker-end="url(#edit-to-page-arrow-accent)"/>
          <text x="672" y="748">Rendered HTML</text>
          <rect x="808" y="736" width="28" height="16" rx="2" fill="#4d4d4c" stroke="#4d4d4c" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
          <text x="822" y="748" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
          <text x="844" y="748">Alternative branches</text>
        </g>
      </svg>
