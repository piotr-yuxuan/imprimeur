<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 460" width="880" height="460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" id="architecture-dark-root">
        <title id="architecture-dark-title">How imprimeur shows a buffer</title>
        <desc id="architecture-dark-desc">Emacs sends the unsaved text of a buffer to pandoc with the Lua filter imprimeur.lua; a server inside Emacs, on 127.0.0.1 under a random token, serves the HTML to a page in an xwidget or in Chromium; links followed in the page go back to Emacs, and where the reader scrolls or double-clicks moves the window start or point of the source.</desc>
        <defs>
      <style>#architecture-dark-root { --color-paper:   #1d1f21;
      --color-ink:     #c5c8c6;
      --color-muted:   #a8aaa8;
      --color-accent:  #b294bb;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-dark-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8aaa8"/></marker>
          <marker id="architecture-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b294bb"/></marker>
          <marker id="architecture-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#81a2be"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1d1f21"/>
        <!-- Zone: what the loopback address and the token protect (security) -->
        <rect x="332" y="144" width="508" height="112" rx="8" fill="#b294bb" stroke="#b294bb" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.05" stroke-opacity="0.5"/>
        <rect x="664" y="148" width="160" height="12" rx="2" fill="#242529"/>
        <text x="744" y="157" fill="#969896" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">127.0.0.1 · 128-BIT TOKEN</text>
        <!-- Arrows, behind the nodes -->
        <line x1="220" y1="72" x2="347" y2="72" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <line x1="448" y1="104" x2="448" y2="175" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <line x1="448" y1="304" x2="448" y2="241" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <line x1="548" y1="196" x2="663" y2="196" stroke="#81a2be" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
        <line x1="664" y1="220" x2="549" y2="220" stroke="#81a2be" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
        <line x1="348" y1="208" x2="221" y2="208" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <path d="M 348,182 H 296 V 92 H 221" fill="none" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <!-- Arrow labels -->
        <rect x="248" y="52" width="72" height="12" rx="2" fill="#1d1f21"/>
        <text x="284" text-anchor="middle" y="61" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">UNSAVED TEXT</text>
        <rect x="456" y="116" width="68" height="12" rx="2" fill="#1d1f21"/>
        <text x="460" y="125" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">HTML + META</text>
        <rect x="456" y="272" width="36" height="12" rx="2" fill="#1d1f21"/>
        <text x="460" y="281" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">MEDIA</text>
        <rect x="568" y="176" width="76" height="12" rx="2" fill="#242529"/>
        <text x="606" text-anchor="middle" y="185" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">EVENTS · DOC</text>
        <rect x="568" y="228" width="76" height="22" rx="2" fill="#242529"/>
        <text x="606" text-anchor="middle" y="237" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">READY · OPEN</text>
        <text x="606" text-anchor="middle" y="247" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SCROLL · GOTO</text>
        <rect x="239" y="122" width="114" height="12" rx="2" fill="#1d1f21"/>
        <text x="296" text-anchor="middle" y="131" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">WINDOW START · POINT</text>
        <rect x="256" y="188" width="56" height="12" rx="2" fill="#1d1f21"/>
        <text x="284" text-anchor="middle" y="197" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">OPEN LINK</text>
        <!-- Node: Emacs buffer (input) -->
        <rect x="40" y="40" width="180" height="64" rx="6" fill="#1d1f21"/>
        <rect x="40" y="40" width="180" height="64" rx="6" fill="#a8aaa8" stroke="#969896" stroke-width="1" fill-opacity="0.1"/>
        <rect x="48" y="48" width="36" height="12" rx="2" fill="none" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="66" y="57" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EMACS</text>
        <text x="130" y="76" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Emacs buffer</text>
        <text x="130" y="92" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Org, Markdown, …</text>
        <!-- Node: pandoc (backend) -->
        <rect x="348" y="40" width="200" height="64" rx="6" fill="#1d1f21"/>
        <rect x="348" y="40" width="200" height="64" rx="6" fill="#282a2e" stroke="#c5c8c6" stroke-width="1"/>
        <rect x="356" y="48" width="48" height="12" rx="2" fill="none" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="380" y="57" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROCESS</text>
        <text x="448" y="76" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">pandoc + imprimeur.lua</text>
        <text x="448" y="92" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stdin · --sandbox if untrusted</text>
        <!-- Node: link handlers (external) -->
        <rect x="40" y="156" width="180" height="104" rx="6" fill="#1d1f21"/>
        <rect x="40" y="156" width="180" height="104" rx="6" fill="#c5c8c6" stroke="#c5c8c6" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.3"/>
        <rect x="48" y="164" width="36" height="12" rx="2" fill="none" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="66" y="173" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EMACS</text>
        <text x="130" y="200" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">browse-url</text>
        <text x="130" y="214" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">http, https, mailto</text>
        <text x="130" y="236" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">find-file-other-window</text>
        <text x="130" y="250" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">documents, media</text>
        <!-- Node: session and server (focal) -->
        <rect x="348" y="176" width="200" height="64" rx="6" fill="#1d1f21"/>
        <rect x="348" y="176" width="200" height="64" rx="6" fill="#b294bb" stroke="#b294bb" stroke-width="1" fill-opacity="0.1"/>
        <rect x="356" y="184" width="36" height="12" rx="2" fill="none" stroke="#b294bb" stroke-width="0.8" stroke-opacity="0.5"/>
        <text x="374" y="193" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EMACS</text>
        <text x="448" y="212" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session and server</text>
        <text x="448" y="228" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one server per Emacs</text>
        <!-- Node: page (backend) -->
        <rect x="664" y="176" width="160" height="72" rx="6" fill="#1d1f21"/>
        <rect x="664" y="176" width="160" height="72" rx="6" fill="#282a2e" stroke="#c5c8c6" stroke-width="1"/>
        <rect x="672" y="184" width="28" height="12" rx="2" fill="none" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="686" y="193" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="744" y="210" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Page in an xwidget</text>
        <text x="744" y="224" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">or in Chromium</text>
        <text x="744" y="238" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DOMPurify → main</text>
        <!-- Node: files under the root (store) -->
        <rect x="348" y="304" width="200" height="64" rx="6" fill="#1d1f21"/>
        <rect x="348" y="304" width="200" height="64" rx="6" fill="#c5c8c6" stroke="#a8aaa8" stroke-width="1" fill-opacity="0.05"/>
        <rect x="356" y="312" width="32" height="12" rx="2" fill="none" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.3"/>
        <text x="372" y="321" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="448" y="340" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Files under the root</text>
        <text x="448" y="356" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">git root or file’s directory</text>
        <!-- Callouts, in the margins -->
        <path d="M 592,64 Q 568,64 552,72" fill="none" stroke="#c5c8c6" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
        <circle cx="550" cy="72" r="2" fill="#c5c8c6"/>
        <text x="600" y="60" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Renders 0.3 s after the last change,</text>
        <text x="600" y="78" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">or 2 s after the first while typing;</text>
        <text x="600" y="96" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">one at a time, while a page is open.</text>
        <path d="M 72,286 Q 72,268 88,262" fill="none" stroke="#c5c8c6" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
        <circle cx="88" cy="261" r="2" fill="#c5c8c6"/>
        <text x="40" y="300" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Emacs drops any other link.</text>
        <!-- Legend strip -->
        <line x1="40" y1="392" x2="840" y2="392" stroke="#c5c8c6" stroke-width="0.8" stroke-opacity="0.1"/>
        <text x="40" y="408" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="420" width="14" height="10" rx="2" fill="#a8aaa8" stroke="#969896" stroke-width="1" fill-opacity="0.1"/>
        <text x="60" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Input</text>
        <rect x="124" y="420" width="14" height="10" rx="2" fill="#282a2e" stroke="#c5c8c6" stroke-width="1"/>
        <text x="144" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Process</text>
        <rect x="220" y="420" width="14" height="10" rx="2" fill="#b294bb" stroke="#b294bb" stroke-width="1" fill-opacity="0.1"/>
        <text x="240" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Focal</text>
        <rect x="304" y="420" width="14" height="10" rx="2" fill="#c5c8c6" stroke="#a8aaa8" stroke-width="1" fill-opacity="0.05"/>
        <text x="324" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Store</text>
        <rect x="388" y="420" width="14" height="10" rx="2" fill="#c5c8c6" stroke="#c5c8c6" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.3"/>
        <text x="408" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">External</text>
        <rect x="488" y="420" width="14" height="10" rx="2" fill="#b294bb" stroke="#b294bb" stroke-width="1" stroke-dasharray="3,2" fill-opacity="0.05" stroke-opacity="0.5"/>
        <text x="508" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Loopback and token</text>
        <line x1="640" y1="425" x2="668" y2="425" stroke="#81a2be" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
        <text x="676" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">HTTP</text>
        <line x1="740" y1="425" x2="768" y2="425" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
        <text x="776" y="429" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Data or call</text>
      </svg>
