<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="defences-title defences-desc" id="defences-root">
      <title id="defences-title">What stands between a hostile document and you</title>
      <desc id="defences-desc">Five defences that a hostile document meets in turn, from sandboxed pandoc through DOMPurify, the Content Security Policy and links routed through Emacs to the loopback server and its browser's desktop window, each with what it stops and what it lets through, the web page and local user that meet only the last one, and what still reaches you.</desc>
      <defs>
      <style>#defences-root { --color-paper:   #f7f7f7;   
      --color-ink:     #4d4d4c;
      --color-muted:   #5e605c;
      --color-accent:  #8959a8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #defences-root { font-family: var(--font-sans); color: var(--color-ink); }
      #defences-root .diagram-container { width: 100%; overflow-x: auto; }
      #defences-root .diagram-container { overflow-x: visible; }</style>
      <marker id="defences-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5e605c"/></marker>
      <marker id="defences-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8959a8"/></marker>
      <marker id="defences-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4271ae"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f7f7"/>

      <!-- Connectors first, so that the boxes drawn later cover their ends:
           the document enters the first layer, the web page and the local
           user meet only the last, and what the last lets through reaches you. -->
      <line x1="200" y1="120" x2="200" y2="159" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="140" y1="580" x2="140" y2="541" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="380" y1="580" x2="380" y2="541" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="664" y1="540" x2="664" y2="579" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>

      <!-- The threat that the stack is about -->
      <rect x="40" y="40" width="320" height="80" rx="6" fill="#f7f7f7"/>
      <rect x="40" y="40" width="320" height="80" rx="6" fill="#5e605c" stroke="#6a6c68" stroke-width="1" fill-opacity="0.10"/>
      <rect x="56" y="52" width="60" height="16" rx="2" fill="none" stroke="#6a6c68" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="86" y="64" fill="#5e605c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">THREAT</text>
      <text x="56" y="90" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">A hostile document</text>
      <text x="56" y="108" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">not in trusted-content</text>

      <!-- Column headers -->
      <text x="368" y="148" fill="#5e605c" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Stops</text>
      <text x="680" y="148" fill="#5e605c" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif">Lets through</text>

      <!-- The stack: one band per layer, in the order a document meets them -->
      <rect x="40" y="160" width="944" height="380" rx="6" fill="#ffffff"/>
      <line x1="40" y1="236" x2="984" y2="236" stroke="#4d4d4c" stroke-width="1" stroke-opacity="0.12"/>
      <line x1="40" y1="312" x2="984" y2="312" stroke="#4d4d4c" stroke-width="1" stroke-opacity="0.12"/>
      <line x1="40" y1="388" x2="984" y2="388" stroke="#4d4d4c" stroke-width="1" stroke-opacity="0.12"/>
      <line x1="40" y1="464" x2="984" y2="464" stroke="#4d4d4c" stroke-width="1" stroke-opacity="0.12"/>
      <rect x="40" y="160" width="944" height="380" rx="6" fill="none" stroke="#5e605c" stroke-width="1"/>
      <!-- What each layer lets through goes down into the next one -->
      <line x1="664" y1="220" x2="664" y2="252" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="664" y1="296" x2="664" y2="328" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="664" y1="372" x2="664" y2="404" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>
      <line x1="664" y1="448" x2="664" y2="480" stroke="#5e605c" stroke-width="1.2" marker-end="url(#defences-arrow)"/>

      <!-- 01 Sandboxed pandoc -->
      <text x="56" y="192" fill="#6a6c68" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">01</text>
      <text x="88" y="192" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Sandboxed pandoc</text>
      <text x="88" y="212" fill="#6a6c68" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">--sandbox, a filter without I/O</text>
      <text x="368" y="192" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif"><tspan font-family="'Geist Mono', ui-monospace, monospace">#+INCLUDE</tspan> of other files, the network</text>
      <text x="368" y="212" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">remote images, turned into links</text>
      <text x="680" y="192" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">any markup the document writes,</text>
      <text x="680" y="212" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">raw HTML included</text>

      <!-- 02 DOMPurify -->
      <text x="56" y="268" fill="#6a6c68" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">02</text>
      <text x="88" y="268" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">DOMPurify</text>
      <text x="88" y="288" fill="#6a6c68" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">sanitize() on every revision</text>
      <text x="368" y="268" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">scripts, handlers, <tspan font-family="'Geist Mono', ui-monospace, monospace">javascript:</tspan> URLs</text>
      <text x="368" y="288" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">forms, frames, <tspan font-family="'Geist Mono', ui-monospace, monospace">&lt;style&gt;</tspan>, clobbering ids</text>
      <text x="680" y="268" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">links, images, media, SVG</text>
      <text x="680" y="288" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">and inline styles</text>

      <!-- 03 Content Security Policy -->
      <text x="56" y="344" fill="#6a6c68" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">03</text>
      <text x="88" y="344" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Content Security Policy</text>
      <text x="88" y="364" fill="#6a6c68" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">default-src 'none'</text>
      <text x="368" y="344" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">scripts imprimeur did not serve</text>
      <text x="368" y="364" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">loads from other hosts, any frame</text>
      <text x="680" y="344" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">requests to its own server,</text>
      <text x="680" y="364" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">and following a link</text>

      <!-- 04 Links through Emacs -->
      <text x="56" y="420" fill="#6a6c68" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">04</text>
      <text x="88" y="420" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Links through Emacs</text>
      <text x="88" y="440" fill="#6a6c68" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">POST .imprimeur/post</text>
      <text x="368" y="420" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">the page navigating by itself</text>
      <text x="368" y="440" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">other targets, which Emacs drops</text>
      <text x="680" y="420" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">web addresses, to <tspan font-family="'Geist Mono', ui-monospace, monospace">browse-url</tspan>;</text>
      <text x="680" y="440" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">documents and media under the root, to Emacs</text>

      <!-- 05 Server and desktop window -->
      <text x="56" y="496" fill="#6a6c68" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">05</text>
      <text x="88" y="496" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Server and desktop window</text>
      <text x="88" y="516" fill="#6a6c68" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">127.0.0.1, token in no command line</text>
      <text x="368" y="496" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">requests with a wrong token or Host</text>
      <text x="368" y="516" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">files outside the root, even through a symlink</text>
      <text x="680" y="496" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">media under the root, to the page;</text>
      <text x="680" y="516" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">the page, to whoever has its URL</text>

      <!-- The threats that skip the document's layers -->
      <rect x="40" y="580" width="200" height="96" rx="6" fill="#f7f7f7"/>
      <rect x="40" y="580" width="200" height="96" rx="6" fill="#5e605c" stroke="#6a6c68" stroke-width="1" fill-opacity="0.10"/>
      <rect x="56" y="600" width="60" height="16" rx="2" fill="none" stroke="#6a6c68" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="86" y="612" fill="#5e605c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">THREAT</text>
      <text x="56" y="638" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">A web page</text>
      <text x="56" y="656" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">DNS rebinding</text>
      <rect x="280" y="580" width="200" height="96" rx="6" fill="#f7f7f7"/>
      <rect x="280" y="580" width="200" height="96" rx="6" fill="#5e605c" stroke="#6a6c68" stroke-width="1" fill-opacity="0.10"/>
      <rect x="296" y="600" width="60" height="16" rx="2" fill="none" stroke="#6a6c68" stroke-width="0.8" stroke-opacity="0.40"/>
      <text x="326" y="612" fill="#5e605c" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em" text-anchor="middle">THREAT</text>
      <text x="296" y="638" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">A local user</text>
      <text x="296" y="656" fill="#5e605c" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">another uid</text>

      <!-- Focal: what remains -->
      <rect x="520" y="580" width="464" height="96" rx="6" fill="#f7f7f7"/>
      <rect x="520" y="580" width="464" height="96" rx="6" fill="#8959a8" stroke="#8959a8" stroke-width="1" fill-opacity="0.08"/>
      <text x="536" y="608" fill="#4d4d4c" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">You and your files</text>
      <text x="536" y="628" fill="#5e605c" font-size="12" font-family="'Geist', system-ui, sans-serif">What remains: the links you click, the media under the root</text>
      <text x="536" y="644" fill="#5e605c" font-size="12" font-family="'Geist', system-ui, sans-serif">that the page shows, and the page, to whoever has its URL.</text>
      <text x="536" y="660" fill="#4d4d4c" font-size="12" font-family="'Geist', system-ui, sans-serif">Your part: click only what you trust; keep the URL private.</text>

      <!-- Caption -->
      <text x="40" y="712" fill="#5e605c" font-size="12" font-family="'Geist', system-ui, sans-serif">Two settings relax these layers: <tspan font-family="'Geist Mono', ui-monospace, monospace">trusted-content</tspan> lifts <tspan font-family="'Geist Mono', ui-monospace, monospace">--sandbox</tspan> and, by default, lets remote images load;</text>
      <text x="40" y="730" fill="#5e605c" font-size="12" font-family="'Geist', system-ui, sans-serif"><tspan font-family="'Geist Mono', ui-monospace, monospace">imprimeur-remote-images</tspan> set to <tspan font-family="'Geist Mono', ui-monospace, monospace">t</tspan> lets them load for every document.</text>
      </svg>
