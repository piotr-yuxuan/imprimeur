<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" role="img" aria-label="Bars of the Bank of England's reserve, in millions of pounds, against three lines. It stood at 11.297 at the end of 1869, and fell to 3 in 1866, 1.994 in 1847, 1.462 in 1857 and 1.027 in 1825. The lines are the apprehension minimum at 10, the practical minimum of 11 to 11.5, and the point to begin acting, 14 to 15.">
  <!-- Written for imprimeur; the figures are Bagehot's. -->
  <rect width="560" height="262" fill="#fcfcfb"/>
  <g font-family="Inter, 'Adwaita Sans', Arial, sans-serif" font-size="12.5">
    <rect x="397" y="44" width="13.5" height="188" fill="#1f4fa3" fill-opacity="0.2"/>
    <rect x="478" y="44" width="27.0" height="188" fill="#1f4fa3" fill-opacity="0.1"/>
    <text x="100" y="251" text-anchor="middle" fill="#5c6166">0</text>
    <text x="235" y="251" text-anchor="middle" fill="#5c6166">5</text>
    <line x1="235" y1="232" x2="235" y2="237" stroke="#8b9197"/>
    <text x="370" y="251" text-anchor="middle" fill="#5c6166">10</text>
    <line x1="370" y1="232" x2="370" y2="237" stroke="#8b9197"/>
    <text x="505" y="251" text-anchor="middle" fill="#5c6166">15</text>
    <line x1="505" y1="232" x2="505" y2="237" stroke="#8b9197"/>
    <line x1="100" y1="232" x2="532" y2="232" stroke="#8b9197"/>
    <line x1="370" y1="44" x2="370" y2="232" stroke="#b3261e" stroke-width="1.5"/>
    <text x="362" y="16" text-anchor="end" fill="#b3261e" font-weight="600">Apprehension minimum</text>
    <text x="362" y="33" text-anchor="end" fill="#b3261e">10</text>
    <text x="403.75" y="16" text-anchor="middle" fill="#1f4fa3" font-weight="600">Never below</text>
    <text x="403.75" y="33" text-anchor="middle" fill="#1f4fa3">11 to 11.5</text>
    <text x="478" y="16" text-anchor="start" fill="#1f4fa3" font-weight="600">Begin to act</text>
    <text x="478" y="33" text-anchor="start" fill="#1f4fa3">14 to 15</text>
    <text x="94" y="69" text-anchor="end" fill="#1a1c1e">End of 1869</text>
    <rect x="100" y="56" width="305.0" height="18" rx="2" fill="#8b9197"/>
    <text x="411" y="69" fill="#1a1c1e">11.297</text>
    <text x="94" y="104" text-anchor="end" fill="#1a1c1e">Panic of 1866</text>
    <rect x="100" y="91" width="81.0" height="18" rx="2" fill="#8b9197"/>
    <text x="187" y="104" fill="#1a1c1e">3.000</text>
    <text x="94" y="139" text-anchor="end" fill="#1a1c1e">Panic of 1847</text>
    <rect x="100" y="126" width="53.8" height="18" rx="2" fill="#8b9197"/>
    <text x="159.8" y="139" fill="#1a1c1e">1.994</text>
    <text x="94" y="174" text-anchor="end" fill="#1a1c1e">Panic of 1857</text>
    <rect x="100" y="161" width="39.5" height="18" rx="2" fill="#8b9197"/>
    <text x="145.5" y="174" fill="#1a1c1e">1.462</text>
    <text x="94" y="209" text-anchor="end" fill="#1a1c1e">Panic of 1825</text>
    <rect x="100" y="196" width="27.7" height="18" rx="2" fill="#8b9197"/>
    <text x="133.7" y="209" fill="#1a1c1e">1.027</text>
  </g>
</svg>
